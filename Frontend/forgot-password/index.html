<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Online File Sharing System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<header class="main-header">
    <h1 class="project-title">Online File Sharing System</h1>
    <button class="toggle-btn" id="modeBtn">🌙</button>
</header>

<div class="container">
    <div class="login-box">

        <h2>Forgot Password</h2>
        <p class="subtitle">
            Enter your registered email to receive an OTP.
        </p>

        <!-- Email -->
        <div class="input-group">
            <input type="email" id="email" placeholder="Enter your registered email">
        </div>

        <button id="sendOtpBtn" class="login-btn">
            Send OTP
        </button>

        <!-- OTP Section -->
        <div id="otpSection" style="display:none; margin-top:20px;">

            <div class="input-group">
                <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">
            </div>

            <button id="verifyOtpBtn" class="login-btn">
                Verify OTP
            </button>

            <p style="margin-top:15px; font-size:14px;">
                Didn’t receive code?
                <span id="resendBtn" style="color:#4CAF50; cursor:pointer;">
                    Resend OTP
                </span>
            </p>

        </div>

        <div class="divider"><span>OR</span></div>
        <a href="login.html" class="forgot">Back to Login</a>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
