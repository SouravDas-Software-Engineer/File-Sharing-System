<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password | Online File Sharing System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="dark">

<header class="main-header">
    <h1 class="project-title">Online File Sharing System</h1>
    <button class="toggle-btn" id="modeBtn">🌙</button>
</header>

<div class="container">
    <div class="login-box">
        <h2>Create New Password</h2>
        <p class="subtitle">Please enter your new password below.</p>

        <div class="input-group">
            <input type="password" id="newPassword" placeholder="New Password">
        </div>
        
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirm New Password">
        </div>

        <button id="resetBtn" class="login-btn">
            Reset Password
        </button>

        <div class="divider"><span>OR</span></div>
        
        <a href="/Frontend/Login page/index.html" class="forgot" style="display: block; margin-top: 10px;">Back to Login</a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
