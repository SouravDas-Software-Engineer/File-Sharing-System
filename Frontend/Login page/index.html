<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Online File Sharing System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark">

<header class="main-header">
    <h1 class="project-title">Online File Sharing System</h1>
    <button class="toggle-btn" id="modeBtn">🌙</button>
</header>

<div class="container">
    <div class="login-box">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to access your files securely.
        </p>

        <!-- Email -->
        <div class="input-group">
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <!-- Password -->
        <div class="input-group">
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <!-- Login Button -->
        <button class="login-btn" id="loginBtn">Login</button>

        <!-- Message Display -->
        <p id="message"></p>

        <!-- Forgot password -->
        <div style="text-align: right; margin-top: 10px;">
            <a href="/Frontend/forgot-password/" class="forgot">Forgot Password?</a>
        </div>

        <div class="divider"><span>OR</span></div>

        <!-- Signup -->
        <a href="/Frontend/Signup page/" class="forgot">Sign Up</a>

    </div>
</div>

<!-- Dark Mode Script -->
<script>
const modeBtn = document.getElementById("modeBtn");

modeBtn.addEventListener("click", function () {

    document.body.classList.toggle("dark");
    document.body.classList.toggle("light");

    if (document.body.classList.contains("dark")) {
        modeBtn.textContent = "🌙";
    } else {
        modeBtn.textContent = "☀️";
    }

});
</script>

<!-- Login Script -->
<script src="script.js"></script>

</body>
</html>
