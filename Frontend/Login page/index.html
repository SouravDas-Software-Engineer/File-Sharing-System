<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | FileShare</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../auth-shared.css">
</head>

<body class="dark-mode">

    <header class="main-header">
        <h1 class="project-title">FileShare</h1>
        <button class="mode-toggle-btn" id="modeBtn">🌙</button>
    </header>

    <div class="auth-container">
        <div class="glass-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Securely access your cloud storage.</p>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <button id="loginBtn" class="auth-btn">Login</button>

            <p id="message"></p>

            <div class="auth-links">
                <a href="../forgot-password/index.html">Forgot Password?</a>
            </div>

            <div class="divider">OR</div>

            <button onclick="location.href='../Signup page/index.html'" class="auth-btn"
                style="background: var(--bg-glass); color: var(--text-main); border: 1px solid var(--border-glass); box-shadow: none;">Create
                New Account</button>
        </div>
    </div>

    <!-- Waves Background -->
    <div class="waves-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
            viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="var(--wave-color)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="var(--wave-color-2)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="var(--wave-color-3)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="var(--wave-color-4)" />
            </g>
        </svg>
    </div>

    <script src="script.js"></script>
</body>

</html>
